<form method="POST" action="{% url 'sessions-index' %}">
    {% csrf_token %}
    <label>Title</label>
    <input name="title" type="text" placeholder="session title" required>
    <br>
    <label>Slug</label>
    <input name="slug" type="text" placeholder="session-slug" required>
    <br>
    <label>Description</label>
    <textarea name="description"></textarea>
    <br>
    <label>Starts At</label>
    <input name="starts_at" type="datetime-local" step="1">
    <br>
    <label>Ends At</label>
    <input name="ends_at" type="datetime-local" step="1">
    <br>
    <label>Wave</label>
    <select name="wave">
        {% for wave in waves %}
            <option value="{{ wave.slug }}">{{ wave.title }} | {{ wave.slug }}</option>
        {% endfor %}
    </select>
    <br>
    <label>Level</label>
    <select name="level">
        {% for level in levels %}
            <option value="{{ level.slug }}">{{ level.title }} | {{ level.slug }}</option>
        {% endfor %}
    </select>
    <br>
    <button type="submit">Submit</button>
</form>
