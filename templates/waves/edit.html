<form method="POST" action="{% url 'waves-edit' wave.slug %}">
    {% csrf_token %}
    <label>Title</label>
    <input name="title" type="text" placeholder="wave title" value="{{ wave.title }}" required>
    <br>
    <label>Slug</label>
    <input name="slug" type="text" placeholder="wave-slug" value="{{ wave.slug }}" required>
    <br>
    <label>Description</label>
    <textarea name="description">{{ wave.description }}</textarea>
    <br>
    <label>Starts At</label>
    <input name="starts_at" type="datetime-local" step="1" value="{{ wave.starts_at }}">
    <br>
    <label>Ends At</label>
    <input name="ends_at" type="datetime-local" step="1" value="{{ wave.ends_at }}">
    <br>
    <button type="submit">Submit</button>
</form>

<a href="{% url 'waves-show' wave.slug %}">{{ wave.title }}</a>
