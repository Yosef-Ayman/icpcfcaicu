{# include with: level, color #}
<article class="panel level-card relative flex h-full flex-col overflow-hidden" style="--lc: {{ color|default:'#2b6aad' }}">
  {% if level.thumbnail_url %}
    <img src="{{ level.thumbnail_url }}" alt="{{ level.title }}" width="640" height="360" class="aspect-video w-full object-cover" loading="lazy">
  {% else %}
    {% include "partials/empty_thumbnail.html" %}
  {% endif %}
  <div class="flex flex-1 flex-col p-6 sm:p-7">
    <div class="flex items-center gap-2">
      <span class="level-dot size-3 rounded-full" aria-hidden="true"></span>
      <h3 class="text-xl"><a href="{{ level.get_absolute_url }}" class="after:absolute hover:text-brand-text">{{ level.title }}</a></h3>
    </div>
    {% if level.description %}<p class="mt-3 flex-1 text-sm text-body">{{ level.description|truncatewords:25 }}</p>{% endif %}
    <span class="mt-6 text-sm font-semibold text-brand-text">Explore level</span>
  </div>
</article>
